[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  framework = "#auto"

# P4.5 (2026-09-29): Alex Merced's own project pages live only on alexmercedai.com.
# Recorded in docs-and-audits/network-audit-2026-09-29/redirect-maps/openagenticplatform.com.csv
[[redirects]]
  from = "/knowledge-base/magagent"
  to = "https://alexmercedai.com/knowledge-base/magagent"
  status = 301
  force = true

