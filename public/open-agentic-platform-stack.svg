<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 871" width="1200" height="871" class="oap" role="img" aria-labelledby="oap-auto-title oap-auto-desc">
<title id="oap-auto-title">Open agentic platform reference stack</title>
<desc id="oap-auto-desc">Four layers, foundation at the bottom: 01 Data &amp; semantics: Apache Arrow, Apache Parquet, Apache Iceberg, Apache Polaris, Apache Ossie. 02 Models &amp; routing: Open-weight models, OpenRouter, Nous Portal, Local endpoints, Provider APIs. 03 Harnesses &amp; brokers: OpenCode, Pi, MagAgent, Mag Command Center, Loro, Merced AI, Hermes Agent, Prime Agent. 04 Open standards: Agent Skills, MCP, OAP, AGS, AAIS. The stack rests on your policies, your infrastructure, and your control. Diagram by Alex Merced, CC BY 4.0, openagenticplatform.com.</desc>
<style>
.oap { --bg: #f3f0e8; --band: #fffdf6; --chip: #f3f0e8; --ink: #0c0f10; --muted: #444844; --line: #8a877f; --lime: #3f6212; --cyan: #0e7490; --amber: #a16207; --pink: #be185d; }
@media (prefers-color-scheme: dark) { .oap:not(.oap-light) { --bg: #0c0f10; --band: #151a1a; --chip: #0c0f10; --ink: #f2f0ea; --muted: #b5bab6; --line: #404644; --lime: #c7ff57; --cyan: #65e8ff; --amber: #ffbe42; --pink: #ff71a8; } }
.oap.oap-dark { --bg: #0c0f10; --band: #151a1a; --chip: #0c0f10; --ink: #f2f0ea; --muted: #b5bab6; --line: #404644; --lime: #c7ff57; --cyan: #65e8ff; --amber: #ffbe42; --pink: #ff71a8; }
.oap text { font-family: Arial, Helvetica, 'Liberation Sans', sans-serif; fill: var(--ink); }
.oap .bg { fill: var(--bg); }
.oap .band { fill: var(--band); stroke: var(--line); stroke-width: 1.5; }
.oap .chip { fill: var(--chip); stroke-width: 1.5; }
.oap .chip.example { stroke-dasharray: 5 4; }
.oap .title { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; }
.oap .subtitle { font-size: 17px; fill: var(--muted); }
.oap .kicker { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
.oap .name { font-size: 24px; font-weight: 900; }
.oap .summary { font-size: 15px; fill: var(--muted); }
.oap .chiptext { font-size: 14.5px; font-weight: 600; }
.oap .base { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: var(--muted); }
.oap .foot { font-size: 13.5px; fill: var(--muted); }
</style>
<rect class="bg" width="1200" height="871"/>
<text class="title" x="40" y="62">OPEN AGENTIC PLATFORM REFERENCE STACK</text>
<text class="subtitle" x="40" y="94">Four layers, each replaceable on its own. A stack, not a suite.</text>
<rect class="band" x="40" y="128" width="1120" height="134" rx="4"/>
<rect x="40" y="128" width="8" height="134" style="fill: var(--pink)"/>
<text class="kicker" x="70" y="162" style="fill: var(--pink)">04 / INTEROPERABILITY</text>
<text class="name" x="70" y="194">OPEN STANDARDS</text>
<text class="summary" x="70" y="220">Make skills, context, profiles,</text>
<text class="summary" x="70" y="241">and graphs portable across tools.</text>
<rect class="chip" x="425" y="178" width="127" height="34" rx="17" style="stroke: var(--pink)"/>
<text class="chiptext" x="488.5" y="200" text-anchor="middle">Agent Skills</text>
<rect class="chip" x="562" y="178" width="54" height="34" rx="17" style="stroke: var(--pink)"/>
<text class="chiptext" x="589" y="200" text-anchor="middle">MCP</text>
<rect class="chip example" x="626" y="178" width="135" height="34" rx="17" style="stroke: var(--pink)"/>
<text class="chiptext" x="693.5" y="200" text-anchor="middle">OAP (example)</text>
<rect class="chip example" x="771" y="178" width="135" height="34" rx="17" style="stroke: var(--pink)"/>
<text class="chiptext" x="838.5" y="200" text-anchor="middle">AGS (example)</text>
<rect class="chip example" x="916" y="178" width="143" height="34" rx="17" style="stroke: var(--pink)"/>
<text class="chiptext" x="987.5" y="200" text-anchor="middle">AAIS (example)</text>
<rect class="band" x="40" y="276" width="1120" height="134" rx="4"/>
<rect x="40" y="276" width="8" height="134" style="fill: var(--amber)"/>
<text class="kicker" x="70" y="310" style="fill: var(--amber)">03 / EXECUTION</text>
<text class="name" x="70" y="342">HARNESSES &amp; BROKERS</text>
<text class="summary" x="70" y="368">Turn intent into governed work</text>
<text class="summary" x="70" y="389">with interchangeable runtimes.</text>
<rect class="chip" x="425" y="304" width="95" height="34" rx="17" style="stroke: var(--amber)"/>
<text class="chiptext" x="472.5" y="326" text-anchor="middle">OpenCode</text>
