<text class="chiptext" x="674" y="326" text-anchor="middle">MagAgent (example)</text>
<rect class="chip example" x="772" y="304" width="257" height="34" rx="17" style="stroke: var(--amber)"/>
<text class="chiptext" x="900.5" y="326" text-anchor="middle">Mag Command Center (example)</text>
<rect class="chip example" x="425" y="348" width="143" height="34" rx="17" style="stroke: var(--amber)"/>
<text class="chiptext" x="496.5" y="370" text-anchor="middle">Loro (example)</text>
<rect class="chip example" x="578" y="348" width="184" height="34" rx="17" style="stroke: var(--amber)"/>
<text class="chiptext" x="670" y="370" text-anchor="middle">Merced AI (example)</text>
<rect class="chip" x="772" y="348" width="127" height="34" rx="17" style="stroke: var(--amber)"/>
<text class="chiptext" x="835.5" y="370" text-anchor="middle">Hermes Agent</text>
<rect class="chip" x="909" y="348" width="119" height="34" rx="17" style="stroke: var(--amber)"/>
<text class="chiptext" x="968.5" y="370" text-anchor="middle">Prime Agent</text>
<rect class="band" x="40" y="424" width="1120" height="134" rx="4"/>
<rect x="40" y="424" width="8" height="134" style="fill: var(--cyan)"/>
<text class="kicker" x="70" y="458" style="fill: var(--cyan)">02 / INTELLIGENCE</text>
<text class="name" x="70" y="490">MODELS &amp; ROUTING</text>
<text class="summary" x="70" y="516">Choose models by task, policy,</text>
<text class="summary" x="70" y="537">economics, and deployment needs.</text>
<rect class="chip" x="425" y="452" width="176" height="34" rx="17" style="stroke: var(--cyan)"/>
<text class="chiptext" x="513" y="474" text-anchor="middle">Open-weight models</text>
