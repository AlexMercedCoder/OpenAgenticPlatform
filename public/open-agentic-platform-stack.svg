<rect x="40" y="572" width="8" height="155" style="fill: var(--lime)"/>
<text class="kicker" x="70" y="606" style="fill: var(--lime)">01 / FOUNDATION</text>
<text class="name" x="70" y="638">DATA &amp; SEMANTICS</text>
<text class="summary" x="70" y="664">Give agents durable facts,</text>
<text class="summary" x="70" y="685">portable records, and shared</text>
<text class="summary" x="70" y="706">meaning.</text>
<rect class="chip" x="425" y="610.5" width="127" height="34" rx="17" style="stroke: var(--lime)"/>
<text class="chiptext" x="488.5" y="632.5" text-anchor="middle">Apache Arrow</text>
<rect class="chip" x="562" y="610.5" width="143" height="34" rx="17" style="stroke: var(--lime)"/>
<text class="chiptext" x="633.5" y="632.5" text-anchor="middle">Apache Parquet</text>
<rect class="chip" x="715" y="610.5" width="143" height="34" rx="17" style="stroke: var(--lime)"/>
<text class="chiptext" x="786.5" y="632.5" text-anchor="middle">Apache Iceberg</text>
